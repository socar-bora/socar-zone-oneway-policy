:root{
  color-scheme:light;
  /* SOCAR FRAME 2.0 */
  --white:#FFFFFF;
  --gray-50:#F9F9FB;--gray-100:#F2F3F8;--gray-200:#E5E8EF;--gray-300:#CBD1DC;--gray-400:#B4BBCB;
  --gray-500:#99A1B1;--gray-600:#697383;--gray-700:#4A5667;--gray-800:#354153;--gray-900:#262F3C;--gray-1000:#141A24;
  --blue-50:#EBF5FF;--blue-100:#D6EBFF;--blue-400:#3393FF;--blue-500:#0078FF;--blue-600:#0069FF;--blue-700:#0052E0;
  --indigo-50:#ECEFFE;--indigo-100:#D7DEFE;--indigo-500:#4B68FF;--indigo-600:#3554F8;
  --orange-50:#FFF8E6;--orange-100:#FFF3CC;--orange-300:#FFC566;--orange-500:#FF8800;--orange-600:#FA7900;
  --text-strong:#141A24;--text-primary:#354153;--text-secondary:#697383;--text-tertiary:#99A1B1;--text-disabled:#B4BBCB;
  --primary:#0078FF;--primary-strong:#0069FF;--primary-heavy:#0052E0;
  --border-weak:#F2F3F8;--border:#E5E8EF;
  --negative:#FF3A5B;--positive-strong:#00BB83;--caution:#FF8800;
  --map-land:#F1F1EC;
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;height:100%;background:#FFFFFF;color:var(--text-primary);font-family:var(--font);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all}
p,h2{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ── Layout ── */
.app{height:100%;min-height:640px;display:flex;flex-direction:column}
.gnb{flex:none;height:60px;background:#fff;border-bottom:1px solid var(--gray-200);position:relative;z-index:30}
.gnb__inner{max-width:1280px;height:100%;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:32px}
.gnb__logo{display:block;flex:none;width:101px;height:22px;border-radius:4px}
.gnb__nav{flex:1;min-width:0;display:flex;align-items:center;gap:23px}
.gnb__nav a{font-size:16px;font-weight:600;line-height:24px;color:var(--text-primary);text-decoration:none;white-space:nowrap;border-radius:6px}
.gnb__util{flex:none;display:flex;align-items:center;gap:14px}
.koro{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--gray-300);border-radius:6px;background:#fff;font-size:13px;font-weight:600;line-height:20px;color:var(--text-primary);text-decoration:none;white-space:nowrap}
.gnb__divider{width:1px;height:22px;border-radius:1px;background:var(--gray-200)}
.gnb__login{font-size:14px;font-weight:600;line-height:22px;color:var(--primary);border-radius:6px}
.main{flex:1;min-height:0;display:flex;justify-content:center;padding:24px 32px 18px}
.main__inner{flex:1;max-width:1280px;min-width:0;height:100%;display:flex;gap:24px}

/* ── Left panel ── */
.panel{flex:none;width:375px;min-height:0;display:flex;flex-direction:column}
.results-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--gray-300) transparent}
.controls{flex:none;padding:0 12px}
.seg{position:relative;display:flex;gap:4px;height:42px;padding:4px;border-radius:12px;background:var(--gray-100)}
.seg__slider{position:absolute;top:4px;left:4px;width:calc(50% - 6px);height:34px;border-radius:10px;background:#fff;box-shadow:0 0 2px rgba(38,47,60,.12),0 1px 2px rgba(38,47,60,.06);transition:transform .2s ease}
.seg[data-mode="delivery"] .seg__slider{transform:translateX(calc(100% + 4px))}
.seg__btn{position:relative;z-index:1;flex:1;min-width:0;height:34px;padding:6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:600;line-height:22px;color:var(--text-secondary);white-space:nowrap;transition:color .2s ease}
.seg__btn[aria-selected="true"]{color:var(--text-primary)}
.seg__btn:focus-visible{outline-offset:-2px}
.seg__new{display:inline-flex;align-items:center;height:14px;padding:0 5px;margin-left:2px;border-radius:999px;background:var(--orange-100);font-size:9px;font-weight:700;line-height:14px;letter-spacing:.2px;color:var(--orange-600)}

.fields{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left;transition:border-color .15s ease}
.field:hover{border-color:var(--gray-300)}
.field__text{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:22px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field__icon{flex:none;color:var(--text-primary)}
.loc{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left;transition:border-color .15s ease}
.loc:hover{border-color:var(--gray-300)}
.loc__lead{flex:none;display:flex;align-items:center}
.loc__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.loc__title{font-size:16px;font-weight:600;line-height:24px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc__title.is-placeholder{color:var(--text-tertiary)}
.loc__sub{min-width:0;font-size:13px;font-weight:500;line-height:20px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc__trail{flex:none;color:var(--text-primary)}
/* 배달 + 반납 묶음 */
.locgroup{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.locrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;text-align:left;transition:background-color .15s}
.locrow:hover{background:var(--gray-50)}
.locrow:focus-visible{outline-offset:-2px;border-radius:12px}
.locrow+.locrow{border-top:1px solid var(--border)}
.locrow__title{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:24px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locrow__title.is-placeholder{color:var(--text-tertiary)}
.tag{display:inline-flex;align-items:center;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.tag--del{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--primary-strong)}
.tag--ret{background:var(--indigo-50);border:1px solid var(--indigo-100);color:var(--indigo-500)}

.ret-slot{min-height:22px;margin-top:10px;display:flex}
.ret-info{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;line-height:22px;color:var(--text-tertiary)}
.ret-toggle{display:inline-flex;align-items:center;gap:8px;border-radius:8px}
.ret-toggle__label{font-size:14px;font-weight:600;line-height:22px;color:#637080}
.ret-toggle__fee{margin-left:-4px;font-size:12px;font-weight:600;line-height:18px;color:var(--indigo-500)}

.chips{position:sticky;top:0;z-index:2;display:flex;gap:6px;margin-top:14px;padding:10px 12px;background:#fff;overflow-x:auto;scrollbar-width:none}
.results-scroll.is-browsing .chips{box-shadow:0 1px 0 var(--border-weak)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border:1px solid var(--gray-200);border-radius:19px;background:#fff;font-size:14px;font-weight:600;line-height:22px;color:var(--text-primary);white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--gray-300)}
.chip[aria-pressed="true"]{background:var(--gray-900);border-color:var(--gray-900);color:#fff}
.chip:focus-visible{outline-offset:1px}
.list{min-height:calc(100% - 58px);margin-top:6px;padding-bottom:64px}
.list:focus-visible{outline-offset:-2px;border-radius:16px}

/* zone groups / car items */
.zone-group{border-radius:24px;padding-bottom:16px;background:#fff;transition:background-color .5s ease}
.zone-group+.zone-group{margin-top:8px}
.zone-group.is-flash{background:var(--blue-50);transition-duration:.08s}
.zoneinfo{display:flex;align-items:center;gap:6px;padding:10px 16px 12px}
.zoneinfo__name{font-size:16px;font-weight:600;line-height:24px;color:var(--text-primary)}
.zoneinfo__copy{flex:1;min-width:0}
.zoneinfo__oneway{display:block;font-size:12px;line-height:20px;color:#0078FF;font-weight:600}
.zone-query-status{min-height:100px;padding:12px 16px;background:#F2F7FF;border-bottom:1px solid #E8EBF1;font-size:13px;line-height:20px;color:#374553}
.zone-query-status strong{display:block;color:#0078FF;font-size:14px}
.zone-query-status small{display:block;color:#646F80;font-size:11px}
.zone-ret-option{width:100%}
.zone-ret-option .ret-toggle{width:100%;padding:9px 10px;border:1px solid #DCE4EE;border-radius:8px;background:#F7F9FC}
.zone-ret-option .ret-toggle__label{color:#374553}
.zone-ret-option .ret-info{margin-top:6px;padding-left:2px;font-size:12px}
.zoneinfo__addr{font-size:12px;font-weight:500;line-height:18px;color:var(--text-secondary)}
.cars{display:flex;flex-direction:column;gap:2px}
.dlist{display:flex;flex-direction:column;gap:4px}
.car{position:relative;width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:0;background:transparent;text-align:left;transition:background-color .15s ease}
@media (hover:hover) and (pointer:fine){.app:not(.is-mobile) button.car:hover{background:#F9F9FB;border-radius:12px}}
.car:focus-visible{outline-offset:-2px}
.car__dim{width:100%;display:flex;align-items:center;gap:16px;opacity:.3}
.car__thumb{flex:none;width:140px;display:flex;flex-direction:column;align-items:center}
.car__img{display:block;width:110px;height:70px;object-fit:cover}
.badge-free{position:relative;margin-top:-3px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:40px;background:linear-gradient(90deg,#00AE7A 56.754%,#00B5AF 94.296%);font-size:12px;font-weight:600;line-height:18px;color:#fff;white-space:nowrap}
.car__info{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.car__row{display:flex;flex-direction:column;gap:4px;min-width:0}
.car__name{font-size:16px;font-weight:600;line-height:24px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car__chips{display:flex;flex-wrap:wrap;gap:4px}
.mini-chip{padding:2px 8px;border-radius:16px;background:var(--gray-100);font-size:10px;font-weight:600;line-height:16px;color:var(--text-secondary);white-space:nowrap}
.car__sub{display:flex;flex-direction:column}
.price{display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.price__rate{font-size:16px;line-height:24px;color:var(--negative)}
.price__amount{font-size:18px;line-height:26px;color:var(--text-strong)}
.fee{display:flex;align-items:center;gap:2px;font-size:10px;font-weight:600;line-height:16px;color:var(--indigo-600)}
.reserved-tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:6px;background:var(--gray-500);font-size:12px;font-weight:600;line-height:18px;color:#fff;white-space:nowrap}
.nudge{margin:0 12px 12px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--gray-50)}
.nudge__title{font-size:16px;font-weight:600;line-height:24px;color:var(--text-strong)}
.nudge__body{margin-top:4px;font-size:14px;line-height:22px;color:var(--text-secondary)}
.nudge__actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ActionButton */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;line-height:22px;white-space:nowrap;transition:filter .15s,background-color .15s}
.btn:hover{filter:brightness(.96)}
.btn--primary{background:var(--primary);color:#fff}
.btn--secondary{background:var(--blue-100);color:var(--primary-heavy)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn--ghost{background:transparent;color:var(--text-secondary)}
.btn--ghost:hover{filter:none;background:rgba(38,47,60,.06);color:var(--text-primary)}
.btn--sm{padding:6px 12px;border-radius:10px;font-size:13px;line-height:20px}
.btn--outline{background:#fff;color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--gray-200)}
.btn--outline:hover{filter:none;background:var(--gray-50)}

/* ── Map ── */
.map{position:relative;flex:1;min-width:0;border-radius:16px;overflow:hidden;background:var(--map-land);isolation:isolate}
.map__viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;border-radius:16px}
.map__viewport.is-dragging{cursor:grabbing}
.map__viewport:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.map__svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.ml{font-family:var(--font);paint-order:stroke;stroke:var(--map-land);stroke-width:calc(4px / var(--z,1));stroke-linejoin:round}
.ml--district{font-size:calc(22px / var(--z,1));font-weight:700;fill:#A9B0BB;letter-spacing:calc(3px / var(--z,1))}
.ml--area{font-size:calc(14px / var(--z,1));font-weight:500;fill:#8B93A1}
.ml--park{font-size:calc(14px / var(--z,1));font-weight:600;fill:#5C8C58;stroke:#D4E8C8}
.ml--water{font-size:calc(18px / var(--z,1));font-weight:600;fill:#6C9AC5;stroke:#BFD9F1;letter-spacing:calc(6px / var(--z,1))}
.ml--stn{font-size:calc(12px / var(--z,1));font-weight:600;fill:#4A5667}
.overlay{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.overlay__layer{position:absolute;inset:0}
.map[data-mode="delivery"] #zoneLayer{visibility:hidden}
.poi{position:absolute;display:flex;align-items:center;gap:4px;transform:translate(-4px,-50%);font-size:12px;font-weight:600;line-height:16px;color:#4A5667;white-space:nowrap;opacity:0;transition:opacity .2s;text-shadow:0 0 3px #F1F1EC,0 0 3px #F1F1EC,0 0 2px #F1F1EC}
.poi::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #99A1B1}
.overlay.show-poi .poi{opacity:1}

/* zone pins */
.zpin{position:absolute;width:36px;height:48px;margin:-48px 0 0 -18px;border-radius:18px;transform-origin:50% 100%;transition:transform .16s ease;pointer-events:auto}
.zpin:hover,.zpin.is-hover,.zpin.is-active{transform:scale(1.14);z-index:3}
.zpin:focus-visible{outline-offset:0}
.zpin.is-enter svg{animation:pin-drop .34s cubic-bezier(.2,.7,.2,1) var(--d,0ms) both}
.zpin__tip{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(38,47,60,.18);font-size:12px;font-weight:600;line-height:18px;color:var(--text-primary);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.zpin__tip b{font-weight:600;color:var(--primary)}
.zpin.is-empty .zpin__tip b{color:var(--text-tertiary)}
.zpin:hover .zpin__tip,.zpin.is-hover .zpin__tip,.zpin.is-active .zpin__tip,.zpin:focus-visible .zpin__tip{opacity:1}

/* 배달·반납 핀 — 지도를 움직이면 가운데 핀이 꽂힘 */
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;border-radius:14px}
.map__viewport.is-dragging .pin{cursor:grabbing}
.pin:focus-visible{outline-offset:2px}
.pin.is-active{z-index:4}
.pin__label{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 10px;border-radius:100px;background:var(--gray-900);font-size:12px;font-weight:600;line-height:18px;color:#fff;white-space:nowrap;box-shadow:0 2px 8px rgba(20,26,36,.25);transition:transform .18s cubic-bezier(.2,.7,.2,1),background-color .15s}
.pin__stem{width:2px;height:25px;border-radius:1px;background:var(--gray-900);transform-origin:50% 100%;transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.pin--simple{transform:translate(-50%,-100%)}
.pin--car{transform:translate(-50%,-69px)}
.pin--car .pin__label{min-width:75px}
.pin--car .pin__stem{height:22px}
.pin__car{display:block;transition:transform .18s cubic-bezier(.2,.7,.2,1)}
.pin:hover .pin__label{background:var(--gray-1000)}
.pin__ground{position:absolute;left:50%;bottom:-3px;width:12px;height:5px;margin-left:-6px;border-radius:50%;background:rgba(20,26,36,.32);opacity:0;transition:opacity .15s}
.pin--car .pin__ground{bottom:-5px}
/* 들림 → 꽂힘 */
.pin.is-lifted .pin__label{transform:translateY(-10px)}
.pin.is-lifted .pin__stem{transform:scaleY(1.4)}
.pin--car.is-lifted .pin__stem{transform:scaleY(1.45)}
.pin--car.is-lifted .pin__car{transform:translateY(-10px)}
.pin.is-lifted .pin__ground{opacity:1}
.pin.is-plant .pin__label,.pin--car.is-plant .pin__car{animation:plant .32s cubic-bezier(.3,.7,.4,1)}
.pin.is-plant .pin__stem{animation:plant-stem .32s cubic-bezier(.3,.7,.4,1)}
@keyframes plant{0%{transform:translateY(-10px)}60%{transform:translateY(2px)}100%{transform:none}}
@keyframes plant-stem{0%{transform:scaleY(1.4)}60%{transform:scaleY(.92)}100%{transform:none}}
/* 가운데가 아닌 핀이 아직 확정 전이면 주황 점 */
.pin.is-pending .pin__label::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--caution);box-shadow:0 0 0 2px var(--gray-900)}
.pin.is-enter{animation:pin-in .32s cubic-bezier(.2,.7,.2,1)}
/* 확정된 핀: 연필 아이콘 + hover/focus 때 '위치 수정'이 펼쳐짐 */
.pin.is-set .pin__label{gap:3px;padding:4px 8px 4px 10px}
.pin__name{white-space:nowrap}
.pin__more{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .22s cubic-bezier(.2,.7,.2,1),opacity .18s}
.pin__edit{opacity:.75}
.pin.is-set:hover .pin__label,.pin.is-set:focus-visible .pin__label{background:var(--primary)}
.pin.is-set:hover .pin__stem,.pin.is-set:focus-visible .pin__stem{background:var(--primary)}
.pin.is-set:hover .pin__more,.pin.is-set:focus-visible .pin__more,.pin.is-coach .pin__more{max-width:64px;opacity:1}
.pin.is-set:hover .pin__edit,.pin.is-set:focus-visible .pin__edit{opacity:1}
.pin.is-set.is-pending .pin__label::after{order:-1}
/* 처음 확정한 뒤 한 번 보여주는 말풍선 */
.pin__coach{position:absolute;left:calc(100% + 10px);top:-1px;padding:6px 10px;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(38,47,60,.18);font-size:12px;font-weight:600;line-height:18px;color:var(--text-primary);white-space:nowrap;opacity:0;transform:translateX(-4px);pointer-events:none;transition:opacity .2s,transform .2s}
.pin__coach::before{content:'';position:absolute;left:-5px;top:50%;width:10px;height:10px;margin-top:-5px;background:#fff;transform:rotate(45deg);border-radius:2px}
.pin.is-coach .pin__coach{opacity:1;transform:none}
.pin.is-coach .pin__label{background:var(--primary)}
.pin.is-coach .pin__stem{background:var(--primary)}
.pin.is-editing .pin__coach{display:none}

.map__top{position:absolute;top:16px;left:50%;z-index:9;transform:translateX(-50%);width:calc(100% - 140px);display:flex;justify-content:center;pointer-events:none}
.snackbar{display:flex;align-items:center;gap:8px;max-width:100%;padding:12px 16px;border-radius:20px;background:var(--gray-900);font-size:14px;font-weight:400;line-height:22px;color:#fff;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.snackbar.is-show{opacity:1;transform:none}
.map__research{position:absolute;top:16px;left:50%;z-index:7;display:inline-flex;align-items:center;gap:6px;padding:8px 14px 8px 12px;border-radius:100px;background:#fff;box-shadow:0 2px 12px rgba(38,47,60,.2);font-size:14px;font-weight:600;line-height:22px;color:var(--primary);white-space:nowrap;opacity:0;pointer-events:none;transform:translate(-50%,-6px);transition:opacity .2s,transform .2s}
.map__research.is-show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.zoomctl{position:absolute;right:16px;bottom:20px;z-index:8;display:flex;flex-direction:column;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(38,47,60,.18);overflow:hidden}
.zoomctl button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);border-radius:0}
.zoomctl button:hover:not(:disabled){background:var(--gray-50)}
.zoomctl button+button{border-top:1px solid var(--gray-100)}
.zoomctl button:disabled{color:var(--text-disabled);cursor:default}
.zoomctl button:focus-visible{outline-offset:-2px}
.map__caption{padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.82);font-size:11px;font-weight:500;line-height:16px;color:var(--text-tertiary)}

/* 하단 확정 바 (Figma: blur 15 · white 50% · radius 14) */
.pinbar{position:absolute;left:50%;bottom:20px;z-index:9;width:min(444px,calc(100% - 120px));transform:translateX(-50%);padding:12px 16px;border:1px solid #fff;border-radius:14px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);box-shadow:0 4px 6px rgba(0,0,0,.04)}
.pinbar[hidden]{display:none}
.app:not(.is-mobile) .pinbar{top:20px;bottom:auto;width:min(540px,calc(100% - 32px))}
.app:not(.is-mobile) .map.has-pinbar .map__top{top:calc(var(--pinbar-height,68px) + 24px)}
.pinbar.is-enter{animation:bar-in .26s cubic-bezier(.2,.7,.2,1)}
.pinbar__row{display:flex;align-items:center;gap:12px}
.pinbar__row .btn--ghost{margin-right:-6px}
.pinbar__body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pinbar__name{display:inline-flex;align-items:center;gap:4px;max-width:100%;border-radius:6px;font-size:14px;font-weight:600;line-height:22px;color:var(--text-strong)}
.pinbar__name>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinbar__name:hover{text-decoration:underline;text-underline-offset:3px}
.pinbar__name.is-loading{color:var(--text-tertiary)}
.pinbar__name.is-loading span{background:linear-gradient(90deg,#99A1B1 0%,#CBD1DC 50%,#99A1B1 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:0 0}}
.pinbar__addr{font-size:13px;font-weight:400;line-height:20px;color:#637080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinbar__actions{flex:none;display:flex;align-items:center;gap:6px}
.app:not(.is-mobile) .pinbar__actions .btn{padding:6px 10px;border-radius:8px;height:32px}
.app:not(.is-mobile) .pinbar__actions [data-bar="cancel"]{min-width:50px}
.app:not(.is-mobile) .pinbar__actions [data-bar="confirm"]{min-width:84px}
.pinbar .tag{border:0;box-shadow:inset 0 0 0 1px var(--blue-100)}
.pinbar .tag--ret{box-shadow:inset 0 0 0 1px var(--indigo-100)}
.pinbar__search-icon{flex:none;display:block}
.location-loading{display:inline-flex;align-items:center;justify-content:center;gap:5px;width:50px;height:22px;padding:0 11px;vertical-align:middle}
.location-loading img{flex:none;animation:dot 1s ease-in-out infinite}
.location-loading img:nth-child(2){animation-delay:.15s}
.location-loading img:nth-child(3){animation-delay:.3s}
.pinbar[data-location-state="blocked"] .pinbar__name,.pinbar[data-location-state="editing-blocked"] .pinbar__name,
[data-loc][data-location-state="blocked"] .loc__title,[data-loc][data-location-state="editing-blocked"] .loc__title,
[data-loc][data-location-state="blocked"] .locrow__title,[data-loc][data-location-state="editing-blocked"] .locrow__title{color:var(--text-secondary)}

/* 장소 검색 (모달 / 드롭다운 공통) */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,26,36,.4);display:flex;align-items:center;justify-content:center;padding:24px}
.scrim.delivery-entry{background:rgba(0,0,0,.44)}
.scrim.is-enter{animation:fade-in .18s ease-out}
.sheet{display:flex;flex-direction:column;background:#fff}
.sheet--modal{width:min(480px,100%);height:min(699px,calc(100vh - 48px));border:1px solid var(--border);border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden}
.scrim.is-enter .sheet--modal{animation:sheet-in .22s cubic-bezier(.2,.7,.2,1)}
.sheet--dropdown{position:fixed;z-index:60;border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 32px rgba(38,47,60,.18);overflow:hidden}
.sheet--dropdown.is-enter{animation:drop-in .16s ease-out}
.sheet__head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:62px;padding:10px 16px 0}
.sheet__title{font-size:18px;font-weight:600;line-height:26px;color:var(--text-strong)}
.sheet__close{width:40px;height:40px;margin-right:-8px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--text-strong)}
.sheet__close:hover{background:var(--gray-50)}
.sheet__search{flex:none;padding:12px 16px}
.sinput{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--gray-100);cursor:text}
.sinput:focus-within{box-shadow:inset 0 0 0 1.5px var(--primary)}
.sinput input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;font-weight:600;line-height:24px;color:var(--text-strong)}
.sinput input::placeholder{color:var(--text-tertiary)}
.sinput svg{color:var(--gray-500)}
.sheet__body{flex:1;min-height:0;overflow-y:auto;padding-bottom:16px}
.sheet--dropdown .sheet__body{max-height:380px}
.sec-title{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}
.sec-title p{flex:1;font-size:14px;font-weight:600;line-height:22px;color:var(--text-primary)}
.text-btn{font-size:13px;font-weight:500;line-height:20px;color:var(--text-secondary);border-radius:6px}
.text-btn:hover{color:var(--text-primary)}
.recent{display:flex;align-items:center;gap:12px;margin:0 16px;padding:16px 0;border-bottom:1px solid var(--border-weak)}
.recent__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border-radius:8px}
.recent__line{display:flex;align-items:center;gap:8px}
.recent__name{min-width:0;font-size:16px;font-weight:400;line-height:24px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent__main:hover .recent__name{text-decoration:underline;text-underline-offset:3px}
.recent__addr{padding-left:26px;font-size:13px;font-weight:400;line-height:20px;color:var(--text-secondary)}
.recent__del{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--gray-400)}
.recent__del:hover{background:var(--gray-50);color:var(--gray-600)}
.results{display:flex;flex-direction:column;gap:10px;padding:4px 16px 0}
.result{display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--gray-50);cursor:pointer;transition:background-color .15s}
.result:hover,.result.is-active{background:var(--gray-100)}
.result__text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.result__name{font-size:16px;font-weight:400;line-height:24px;color:var(--text-strong)}
.result__name b{font-weight:600}
.result__addr{font-size:13px;font-weight:400;line-height:20px;color:var(--text-secondary)}
.sheet__empty{padding:28px 16px;text-align:center;font-size:14px;line-height:22px;color:var(--text-secondary)}
.sheet__empty b{display:block;margin-bottom:4px;font-weight:600;color:var(--text-primary)}

/* 프로토타입 전용 옵션 */
.proto-opt{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 12px;border-radius:999px;background:rgba(20,26,36,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 16px rgba(20,26,36,.2)}
.proto-opt__label{margin-right:4px;font-size:12px;font-weight:600;line-height:18px;color:rgba(255,255,255,.7);white-space:nowrap}
.proto-opt button{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;line-height:18px;color:rgba(255,255,255,.75);white-space:nowrap}
.proto-opt button[aria-pressed="true"]{background:#fff;color:var(--text-strong)}
.proto-opt button:focus-visible{outline-color:#fff}

@keyframes pin-drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes pin-in{from{opacity:0;filter:blur(1px)}to{opacity:1;filter:none}}
@keyframes bar-in{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes sheet-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drop-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translate(-50%,0)}25%{transform:translate(calc(-50% - 6px),0)}50%{transform:translate(calc(-50% + 6px),0)}75%{transform:translate(calc(-50% - 3px),0)}}
.pinbar.is-shake{animation:shake .34s ease-in-out}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* 일시 선택 (예시 일정) */
.sheet--dropdown .pop__title{padding:14px 16px 6px;font-size:14px;font-weight:600;line-height:22px;color:var(--text-strong)}
.pop__opts{padding:0 8px}
.opt{width:100%;display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;font-size:14px;font-weight:600;line-height:22px;color:var(--text-primary);text-align:left}
.opt:hover{background:var(--gray-50)}
.pop__foot{margin-top:4px;padding:10px 16px 12px;border-top:1px solid var(--border-weak);font-size:12px;font-weight:500;line-height:18px;color:var(--text-tertiary)}


/* ── 모바일: 지도 전체 화면 + 왼쪽 패널을 바텀시트로 ── */
.stage{height:100%}
.sheet-handle{display:none}
.proto-opt__sep{width:1px;height:16px;margin:0 6px;background:rgba(255,255,255,.25)}
body.is-narrow .proto-opt{top:calc(11px + env(safe-area-inset-top,0px));bottom:auto;left:auto;right:72px;padding:3px}
body.is-narrow .proto-opt>:not(.proto-opt__reset){display:none}
.stage.is-frame{display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px;background:#E7E9EE}
.stage.is-frame .app{width:390px;height:min(844px,calc(100vh - 48px));min-height:0;border-radius:40px;overflow:hidden;position:relative;background:#fff;box-shadow:0 0 0 10px #1C1E21,0 0 0 11px #3A3D42,0 30px 70px rgba(20,26,36,.35)}
.app.is-mobile{position:relative;overflow:hidden;min-height:0}
.app.is-mobile .gnb{height:52px}
.app.is-mobile .gnb__inner{gap:12px;padding:10px 16px}
.app.is-mobile .gnb__nav,.app.is-mobile .koro,.app.is-mobile .gnb__divider{display:none}
.app.is-mobile .gnb__util{margin-left:auto}
.app.is-mobile .main{padding:0;display:block;position:relative}
.app.is-mobile .main__inner{display:block;position:relative;height:100%;max-width:none}
.app.is-mobile .map{position:absolute;inset:0;border-radius:0;max-width:none;height:auto;margin:0}
.app.is-mobile .map__viewport{border-radius:0}
.app.is-mobile .panel{position:absolute;left:0;right:0;bottom:0;z-index:20;width:auto;max-width:none;height:100%;margin:0;background:#fff;border-radius:var(--sheet-radius,20px) var(--sheet-radius,20px) 0 0;box-shadow:0 -4px 24px rgba(38,47,60,.14);transform:translateY(var(--sheet-y,45%));transition:transform .32s cubic-bezier(.2,.7,.2,1),border-radius .32s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .panel.is-dragging{transition:none}
.app.is-mobile .sheet-handle{flex:none;display:flex;align-items:center;justify-content:center;height:var(--sheet-top-space,26px);opacity:var(--sheet-handle-opacity,1);overflow:hidden;cursor:grab;touch-action:none;transition:height .32s cubic-bezier(.2,.7,.2,1),opacity .16s ease}
.app.is-mobile .sheet-handle:active{cursor:grabbing}
.app.is-mobile .sheet-handle span{width:36px;height:4px;border-radius:2px;background:var(--gray-300)}
.app.is-mobile .sheet-handle:focus-visible{outline-offset:-4px}
.app.is-mobile .fields{margin-top:14px}
.app.is-mobile .results-scroll{flex:none;height:calc(var(--sheet-visible,100%) - var(--sheet-top-space,26px));transition:height .32s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .results-scroll{touch-action:pan-x pinch-zoom}
.app.is-mobile .panel.is-dragging .sheet-handle,.app.is-mobile .panel.is-dragging .results-scroll{transition:none}
.app.is-mobile .panel[data-snap="full"] .sheet-handle{pointer-events:none}
.sheet-map-return{display:none}
.app.is-mobile .sheet-map-return{position:absolute;display:inline-flex;align-items:center;justify-content:center;gap:6px;left:calc(50% + .5px);bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;width:134px;height:40px;padding:9px 16px;border:0;border-radius:48px;background:var(--white);color:var(--text-primary);font-size:14px;font-weight:600;line-height:22px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--gray-900),0 0 6px rgba(38,47,60,.04),0 3px 2px rgba(38,47,60,.04),0 2px 8px rgba(38,47,60,.08);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,visibility 0s linear .16s}
.app.is-mobile.is-sheet-full:not(.is-detail) .sheet-map-return{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .16s ease .12s,visibility 0s}
.sheet-map-return img{flex:none}
.app.is-mobile .panel[data-snap="full"] .list{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app.is-mobile .chips{margin-top:12px}
.app.is-mobile .list{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.app.is-mobile .map__top{top:12px;width:calc(100% - 24px)}
.app.is-mobile .snackbar{font-size:14px}
.app.is-mobile .map__research{top:12px}

.app.is-mobile .zoomctl{right:12px;bottom:calc(var(--pad-b,0px) + 12px)}
/* 수정 중: 시트 대신 하단에 붙는 확정 시트 */
.app.is-mobile .pinbar{left:0;right:0;bottom:0;width:auto;transform:none;z-index:25;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));border:0;border-radius:20px 20px 0 0;background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 -4px 24px rgba(38,47,60,.14)}
.app.is-mobile .pinbar.is-enter{animation:bar-up .3s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .pinbar.is-shake{animation:shake-m .34s ease-in-out}
.app.is-mobile .pinbar__row{flex-wrap:wrap;row-gap:16px}
.app.is-mobile .pinbar__actions{flex:1 1 100%;gap:12px}
.app.is-mobile .pinbar__body{flex:1 1 calc(100% - 56px)}
.app.is-mobile .pinbar__name{font-size:16px;line-height:24px}
.app.is-mobile .pinbar__addr{font-size:14px;line-height:22px}
.app.is-mobile .pinbar__row .btn{flex:1;padding:14px 18px;border-radius:14px;font-size:16px;line-height:24px}
.app.is-mobile .pinbar__row .btn--ghost{flex:0 0 96px;margin-right:0;background:var(--gray-100);color:var(--text-primary)}
@keyframes bar-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes shake-m{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
/* 장소 검색은 전체 화면, 일시는 바텀시트 */
.app.is-mobile .scrim{position:absolute;inset:0;z-index:60;padding:0;background:transparent;align-items:stretch}
.app.is-mobile .sheet--modal{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
.app.is-mobile .scrim.is-enter .sheet--modal{animation:sheet-up .26s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .scrim.scrim--bottom{align-items:flex-end;background:rgba(20,26,36,.4)}
.sheet--bottom{width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(38,47,60,.16)}
.app.is-mobile .scrim.is-enter .sheet--bottom{animation:sheet-up .26s cubic-bezier(.2,.7,.2,1)}
.sheet--bottom .pop__title{padding:18px 20px 8px;font-size:18px;font-weight:600;line-height:26px;color:var(--text-strong)}
.sheet--bottom .pop__opts{padding:0 12px}
.sheet--bottom .opt{padding:14px 8px;font-size:16px;line-height:24px}
.sheet--bottom .pop__foot{padding:12px 20px 4px}
@keyframes sheet-up{from{opacity:.6;transform:translateY(32px)}to{opacity:1;transform:none}}
/* 모바일: 안내 말풍선은 핀 위로 */
.app.is-mobile .pin__coach{left:50%;top:auto;bottom:calc(100% + 10px);transform:translate(-50%,4px)}
.app.is-mobile .pin.is-coach .pin__coach{transform:translate(-50%,0)}
.app.is-mobile .pin__coach::before{left:50%;top:auto;bottom:-5px;margin:0 0 0 -5px}

/* 확정된 핀의 연필 배지 — hover가 없는 모바일에서도 '눌러서 고칠 수 있는 핀'으로 보이게 */
.pin.is-set .pin__label{padding:4px 18px 4px 10px}
.pin__badge{position:absolute;top:2px;right:-10px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--gray-900);box-shadow:0 1px 4px rgba(20,26,36,.28),0 0 0 1px rgba(20,26,36,.06);transition:transform .15s,color .15s}
.pin__badge .pin__edit{opacity:1}
.pin.is-set:hover .pin__badge,.pin.is-set:focus-visible .pin__badge,.pin.is-coach .pin__badge{color:var(--primary)}
.pin.is-set:active .pin__label{transform:scale(.96)}
.pin.is-set:active .pin__badge{transform:scale(.9)}
.pin.is-set.is-pending .pin__label::after{display:none}
.pin.is-set.is-pending .pin__badge{box-shadow:0 0 0 2px var(--caution),0 1px 4px rgba(20,26,36,.28)}
.app.is-mobile .pin__badge{width:24px;height:24px;top:1px;right:-12px}
/* 검색 화면의 '지도에서 핀 위치 조정하기' */
.sheet__maprow{flex:none;display:flex;align-items:center;gap:8px;margin:0 16px 4px;padding:12px 4px;border-bottom:1px solid var(--border-weak);font-size:15px;font-weight:600;line-height:22px;color:var(--primary);text-align:left;border-radius:8px}
.sheet__maprow span{flex:1}
.sheet__maprow .chev{color:var(--gray-400)}
.sheet__maprow:hover{background:var(--blue-50)}

/* 편도 핀 구분: 배달 = 검정 채움, 반납 = 흰 바탕 + 검정 테두리 (색 대신 형태로 구분) */
.app.pins-split .pin--simple.pin--ret .pin__label{background:#fff;color:var(--gray-900);box-shadow:inset 0 0 0 2px var(--gray-900),0 2px 8px rgba(20,26,36,.18)}
.app.pins-split .pin--simple.pin--ret:hover .pin__label,.app.pins-split .pin--simple.pin--ret:focus-visible .pin__label,.app.pins-split .pin--simple.pin--ret.is-coach .pin__label{background:#fff;color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary),0 2px 8px rgba(20,26,36,.18)}
.app.pins-split .pin--simple.pin--ret.is-set .pin__badge{background:var(--gray-900);color:#fff}
.app.pins-split .pin--simple.pin--ret.is-set:hover .pin__badge,.app.pins-split .pin--simple.pin--ret.is-coach .pin__badge{background:var(--primary);color:#fff}

.proto-opt .proto-opt__reset{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 4px 8px;color:#fff}
.proto-opt .proto-opt__reset:hover{background:rgba(255,255,255,.14)}
.proto-opt__reset svg{width:14px;height:14px}
/* 숨겨진 시트 안 요소에 포커스가 가도 화면 전체가 밀리지 않게 */
.app.is-mobile,.app.is-mobile .main,.app.is-mobile .main__inner{overflow:hidden;overflow:clip}

/* ── v11: 피그마 pin · 지도-장소표기 · 장소 인풋 · 배달비 안내 · 검색 ── */
.pin.is-set .pin__label{padding:4px 10px;gap:3px}
.pin__label .pin__edit{opacity:1}
.pin.is-set.is-pending .pin__label::after{display:block;content:'';width:6px;height:6px;border-radius:50%;background:var(--caution);box-shadow:none}
.pin.is-blocked .pin__label{background:var(--gray-500);color:#fff}
.pin.is-blocked .pin__stem{background:var(--gray-500)}
.app.pins-split .pin--simple.pin--ret.is-blocked .pin__label{background:#fff;color:var(--gray-500);box-shadow:inset 0 0 0 2px var(--gray-400),0 2px 8px rgba(20,26,36,.12)}
.app.pins-split .pin--simple.pin--ret.is-blocked .pin__stem{background:var(--gray-400)}
.dots{display:inline-flex;align-items:center;gap:4px;height:24px;vertical-align:top}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--gray-400);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}
.pinbar__name .dots{height:22px}
.pinbar__addr.is-muted,.loc__sub.is-muted{color:var(--text-tertiary)}
.pinbar .btn--primary:disabled{opacity:1;background:var(--gray-100);color:var(--text-disabled)}
.pinbar[data-location-state="loading"] .btn--primary:disabled{background:var(--primary);color:var(--white)}
.locrow__hint{margin-left:8px;font-size:14px;font-weight:500;color:var(--text-tertiary)}
.feeband-slot{flex:none;margin-top:12px;padding:0 1px}
.feeband-slot[hidden]{display:none}
.feeband{display:flex;align-items:center;justify-content:center;gap:6px;height:24px;padding:2px 24px;border-radius:12px;background:linear-gradient(90deg,rgba(249,249,251,0) 0%,#F9F9FB 20%,#F9F9FB 80%,rgba(249,249,251,0) 100%);font-size:13px;font-weight:600;line-height:20px;color:#637080}
.feeband svg{color:var(--gray-700)}
.feeband.is-free{background:linear-gradient(90deg,rgba(235,245,255,0) 0%,#EBF5FF 20%,#EBF5FF 80%,rgba(235,245,255,0) 100%);color:var(--primary)}
.feeband.is-free svg{color:var(--primary)}
.proto-fee-menu{position:fixed;z-index:75;width:196px;padding:8px;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:0 12px 32px rgba(38,47,60,.18)}
.proto-fee-menu p{padding:6px 8px;font-size:12px;color:var(--text-secondary)}
.proto-fee-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 8px;border-radius:8px;font-size:14px}
.proto-fee-menu button:hover{background:var(--gray-50)}
.proto-fee-menu button[aria-checked="true"]{background:var(--blue-50);color:var(--primary);font-weight:600}
body.is-narrow .proto-opt .proto-opt__settings{display:block;padding:4px 8px;font-size:11px;color:#fff}
body.is-narrow .proto-opt .proto-opt__reset{width:28px;padding:4px 7px;font-size:0;gap:0}
.maplink{flex:none;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin:0 16px 4px;padding:2px 0;border-radius:6px;font-size:13px;font-weight:600;line-height:20px;color:var(--text-secondary)}
.maplink:hover{color:var(--text-primary)}
.sinput__clear{flex:none;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:var(--gray-400)}
.sinput__clear:hover{color:var(--gray-600)}
.sinput__clear[hidden],.sinput__icon[hidden]{display:none}
.sinput__icon{flex:none;display:flex;color:var(--gray-500)}

/* 배달·반납 불가 지역: 배달 모드에서만 딤드 + 빗금 */
#mNoSvc{opacity:0;transition:opacity .25s ease}
.map[data-mode="delivery"] #mNoSvc{opacity:1}
.map__notes{position:absolute;left:16px;bottom:20px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.map__legend{display:none;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(38,47,60,.12);font-size:12px;font-weight:600;line-height:18px;color:var(--text-primary)}
.map[data-mode="delivery"] .map__legend{display:inline-flex}
.map__swatch{width:16px;height:12px;border-radius:3px;background:repeating-linear-gradient(45deg,rgba(38,47,60,.36) 0 2px,rgba(38,47,60,.16) 2px 6px);box-shadow:inset 0 0 0 1px rgba(38,47,60,.12)}
.app.is-mobile .map__notes{left:12px;bottom:calc(var(--pad-b,0px) + 12px)}

/* 960px 이하·모바일: 넓은 화면에선 시트·확정 시트·검색을 가운데 600px로 */
.app.is-mobile .panel{left:50%;right:auto;width:min(100%,600px);transform:translate(-50%,var(--sheet-y,45%))}
.app.is-mobile .pinbar{left:50%;right:auto;width:min(100%,600px);transform:translateX(-50%)}
.app.is-mobile .pinbar.is-enter{animation:bar-up-c .3s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .pinbar.is-shake{animation:shake-c .34s ease-in-out}
@keyframes bar-up-c{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes shake-c{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}50%{transform:translateX(calc(-50% + 6px))}75%{transform:translateX(calc(-50% - 3px))}}
.app.is-mobile .scrim{justify-content:center;background:rgba(20,26,36,.4)}
.app.is-mobile .scrim.delivery-entry{background:rgba(0,0,0,.44)}
.app.is-mobile .sheet--modal{width:min(100%,600px)}
.sheet--bottom{width:min(100%,600px)}
.app.is-mobile .scrim.scrim--bottom{justify-content:center}
/* 모바일 확정 시트: 취소는 좁게, 확정이 주 버튼으로 읽히게 */
.app.is-mobile .pinbar__row .btn--outline{flex:0 0 104px}

/* 확정 전 표시용 주황 점은 쓰지 않음 — 확정 전 변경이 남은 채로 다른 핀으로 넘어가는 상태 자체를 가드로 막음 */
.pin.is-pending .pin__label::after,.pin.is-set.is-pending .pin__label::after{content:none;display:none}
/* 모바일 레이아웃(960px 이하)에선 바텀시트·확정 시트·검색·일시 시트 모두 화면 폭을 가득 채움 */
.app.is-mobile .panel{left:0;right:0;width:auto;transform:translateY(var(--sheet-y,45%))}
.app.is-mobile .pinbar{left:0;right:0;width:auto;transform:none}
.app.is-mobile .pinbar.is-enter{animation:bar-up .3s cubic-bezier(.2,.7,.2,1)}
.app.is-mobile .pinbar.is-shake{animation:shake-m .34s ease-in-out}
.app.is-mobile .sheet--modal{width:100%}
.sheet--bottom{width:100%}

/* 캘린더 + 10분 단위 시간 휠 */
.date-picker{width:344px;padding:12px 16px 16px;max-height:calc(100vh - 24px);overflow-y:auto;background:#fff}
.date-picker__head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:var(--text-secondary)}
.date-picker__close{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px}
.date-picker__month{display:flex;align-items:center;justify-content:center;gap:24px;height:56px}
.date-picker__month h2{min-width:118px;text-align:center;font-size:24px;line-height:32px;font-weight:700;color:#101418}
.date-picker__month button{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px}
.date-picker__month button:disabled{color:var(--gray-300);cursor:default}
.date-picker__prev svg{transform:rotate(180deg)}
.calendar-week,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.calendar-week{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
.calendar-week span:first-child,.calendar-day.is-sunday:not(:disabled){color:var(--negative)}
.calendar-grid{padding:8px 0}
.calendar-day{position:relative;height:44px;font-size:14px;border-radius:0;isolation:isolate}
.calendar-day:disabled{color:var(--gray-300);cursor:default}
.calendar-day.is-range{background:var(--blue-50)}
.calendar-day.is-start{border-radius:22px 0 0 22px}
.calendar-day.is-end{border-radius:0 22px 22px 0}
.calendar-day.is-start.is-end{border-radius:22px}
.calendar-day.is-start::before,.calendar-day.is-end::before{content:'';position:absolute;z-index:-1;width:30px;height:30px;top:7px;left:calc(50% - 15px);border-radius:50%;background:var(--gray-800)}
.calendar-day.is-start,.calendar-day.is-end,.calendar-day.is-sunday.is-start,.calendar-day.is-sunday.is-end{color:#fff!important;font-weight:600}
.calendar-day.is-today:not(.is-start):not(.is-end)::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--primary);bottom:4px;left:calc(50% - 2px)}
.calendar-day:focus-visible{outline-offset:-3px;border-radius:8px}
.date-times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.date-time__label{width:100%;padding:10px 0;border-bottom:1px solid var(--border);font-size:16px;font-weight:500;text-align:center;color:var(--text-secondary)}
.date-time__label[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
.time-picker{position:relative;display:flex;align-items:center;height:132px;margin-top:8px;isolation:isolate}
.time-picker::before{position:absolute;inset:44px 0;background:var(--gray-100);border-radius:12px;content:'';z-index:-1}
.time-picker__colon{flex:none;width:12px;font-size:18px;font-weight:600;text-align:center}
.time-wheel{flex:1;min-width:0;height:132px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;padding:44px 0;touch-action:pan-y}
.time-wheel::-webkit-scrollbar{display:none}
.time-wheel:focus-visible{outline-offset:-2px;border-radius:12px}
.time-wheel button{display:block;width:100%;height:44px;scroll-snap-align:center;scroll-snap-stop:always;font-size:18px;color:var(--text-secondary);text-align:center}
.time-wheel button[aria-selected="true"]{font-weight:600;color:var(--text-strong)}
.date-picker__hint{min-height:20px;margin:8px 0 12px;font-size:12px;line-height:20px;text-align:center;color:var(--text-secondary)}
.date-picker__hint.is-error{color:var(--negative)}
.date-picker__apply{width:100%;border-radius:12px}
.app.is-mobile .date-picker{width:100%;max-height:calc(100% - 16px);border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.app.is-mobile .date-picker__apply{padding:14px 18px}

/* ── 차량 상세·주문서 (Figma 11950:181330 / PC·모바일) ── */
.app.is-detail .main{display:none}
.detail{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--white);scroll-behavior:smooth}
.detail[hidden]{display:none}
.detail__wrap{max-width:1200px;margin:0 auto;padding:0 0 100px;position:relative}
.detail__back{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:4px;color:var(--text-secondary);font-size:13px;line-height:20px;min-height:36px;border-radius:6px;z-index:1}
.detail__mobile-header{display:none}
.detail__grid{display:grid;grid-template-columns:minmax(0,720px) 380px;gap:100px;align-items:start}
.detail__left{min-width:0}
.detail__hero{padding:30px 16px 20px}
.detail__photo{display:block;width:320px;height:159px;max-width:100%;object-fit:contain;margin:0 auto 50px}
.detail__title{display:flex;align-items:center;justify-content:space-between;gap:12px;height:32px}
.detail__title h1{margin:0;font-size:22px;line-height:30px;color:var(--text-strong);font-weight:700}
.detail__title .btn{white-space:nowrap}
.detail__date{display:none}
.detail__options{padding:0 16px 24px;display:grid;gap:12px}
.detail__options>h2{display:none}
.detail__option{background:var(--gray-50);border-radius:14px;padding:14px 16px;position:relative}
.detail__option summary{display:flex;align-items:center;gap:6px;list-style:none;font-weight:600;font-size:13px;line-height:20px;color:#00a180}
.detail__option--luggage summary{color:var(--primary-strong)}
.detail summary::-webkit-details-marker{display:none}
.detail__option summary .detail__icon--chevron{position:absolute;right:16px;top:28px}
.detail__option:not([open]) .detail__icon--chevron{transform:rotate(180deg)}
.detail__tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;padding-right:40px}
.detail__tags span{padding:2px 6px;border:0;box-shadow:inset 0 0 0 1px var(--gray-100);border-radius:6px;background:var(--white);font-size:12px;line-height:18px;font-weight:500}
.detail__icon{display:inline-block;vertical-align:middle;flex:none}
.detail__section{padding:24px 16px;border-top:12px solid var(--gray-100);scroll-margin-top:16px}
.detail__heading{display:flex;align-items:center;gap:6px;margin:0 0 20px;font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.detail__heading button{display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
.detail__heading .detail__more{margin-left:auto;font-size:13px;line-height:20px;color:var(--text-secondary);font-weight:400}
.detail__muted{font-size:14px;line-height:22px;color:var(--text-secondary);margin:-14px 0 20px}
.detail__place{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:16px 0;font-size:16px;line-height:24px;color:var(--text-primary);font-weight:600}
.detail__place:first-of-type{margin-top:0}
.detail__place .tag{white-space:nowrap;flex:none;font-size:12px;line-height:18px;padding:2px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--blue-100)}
.detail__place-name{flex:1;min-width:0}
.detail__request{display:flex;flex-direction:column;justify-content:space-between;gap:6px;height:120px;border:1px solid var(--gray-200);border-radius:12px;padding:14px 16px;background:var(--white)}
.detail__request textarea{display:block;width:100%;flex:1;min-height:0;resize:none;border:0;background:none;outline:none;font-family:var(--font);font-size:16px;line-height:24px;color:var(--text-primary);padding:0}
.detail__request textarea::placeholder{color:var(--text-secondary)}
.detail__request:focus-within{border-color:#99ceff}
.detail__request.is-saved{background:var(--white);border-color:var(--gray-200)}
.detail__request-foot{display:flex;justify-content:space-between;align-items:center;color:var(--text-tertiary);font-size:12px;line-height:18px;font-weight:500}
.detail__request-foot .btn{background:var(--gray-100);border:0;color:var(--text-secondary);font-size:12px;line-height:18px;min-height:30px;padding:6px 8px}
.detail__request-foot .btn:disabled{color:var(--text-secondary);cursor:default}
.detail__request.is-filled:not(.is-saved) .btn{background:var(--primary);color:var(--white)}
.detail__place-note{padding:12px 16px;border-radius:12px;background:var(--blue-50);font-size:13px;line-height:20px;color:var(--text-secondary)}
.detail__request-status{font-size:12px;line-height:18px;color:var(--negative);margin-top:6px}
.detail__request-status:empty{display:none}
/* 쏘카존 상세에서 대여 방법·배달/반납 주소 변경 */
.detail__method{margin-bottom:24px}
.detail__method .seg__btn{font-size:14px;line-height:22px;font-weight:600}
.detail__method .seg__btn[aria-selected="true"]{background:var(--white);box-shadow:0 0 2px rgba(38,47,60,.12)}
.detail__new{display:inline-flex;align-items:center;padding:4px 5px;border-radius:500px;background:var(--orange-100)}
.detail__new img{display:block}
.detail__location-stack{display:flex;flex-direction:column;gap:4px}
.detail__location{display:flex;align-items:center;gap:12px;width:100%;min-height:67px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;text-align:left}
.detail__location .tag{flex:none;white-space:nowrap;font-size:12px;line-height:18px;padding:2px 6px;border-radius:6px}
.detail__location-copy{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.detail__location-name{font-size:16px;line-height:24px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail__location-address{font-size:13px;line-height:20px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail__location--empty{min-height:48px;padding:11px 13px;gap:8px;background:var(--gray-50);border-color:var(--blue-400);border-radius:14px;color:var(--text-tertiary)}
.detail__return-option{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.detail__location-stack:has(.detail__request) + .detail__return-option{margin-top:24px}
.detail__return-toggle{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:22px;font-size:14px;line-height:22px;font-weight:600;color:var(--text-secondary)}
.detail__return-toggle[aria-checked="true"]{gap:8px}
.detail__return-fee{margin-left:-4px;color:var(--indigo-500)}
.detail__method-note{margin-top:16px}
.detail__rental-method .detail__request textarea::placeholder{color:var(--text-secondary)}
.detail__rental-method .tag,.detail-search .tag{border:0;box-shadow:inset 0 0 0 1px var(--blue-100)}
.detail__rental-method .tag--ret,.detail-search .tag--ret{box-shadow:inset 0 0 0 1px var(--indigo-100)}
.detail-search .sinput{background:var(--gray-50);box-shadow:inset 0 0 0 1px var(--blue-400)}
.detail-search .sheet__body{padding-top:12px}
.detail-search .recent{position:relative;border:0}
.detail-search .recent__divider{position:absolute;bottom:0;left:0;max-width:100%;overflow:hidden;height:1px}
.detail-search .recent__divider img{display:block}
.detail-search .detail__search-status{padding:12px 16px;color:var(--negative);font-size:13px;line-height:20px}
.app.is-mobile .scrim.detail-search{padding:12px;background:rgba(20,26,36,.4);align-items:center}
.app.is-mobile .detail-search .sheet--modal{width:min(480px,100%);height:min(699px,calc(100% - 24px));border:1px solid var(--border);border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.detail__insurances{display:grid;gap:10px}
.insurance{position:relative;display:block;padding:22px 16px;border:1px solid var(--gray-100);border-radius:14px;cursor:pointer;box-shadow:0 2px 6px rgba(38,47,60,.08)}
.insurance:has(input:checked){border-color:var(--gray-900);box-shadow:inset 0 0 0 .8px var(--gray-900),0 2px 6px rgba(38,47,60,.08)}
.insurance:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.insurance__top{display:flex;align-items:flex-start;gap:16px;font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.insurance input{position:absolute;width:1px;height:1px;opacity:0}
.insurance__copy{flex:1;min-width:0}
.insurance__price{flex:none;font-size:18px;line-height:26px;color:var(--text-strong);white-space:nowrap}
.insurance--basic .insurance__price{font-size:16px;line-height:24px}
.insurance__sub{display:block;margin-top:3px;font-size:14px;line-height:22px;font-weight:400;color:var(--text-secondary)}
.insurance--full .insurance__sub{font-weight:600;color:var(--primary)}
.insurance__benefits{display:grid;gap:2px;margin:14px 0 0;padding:10px 12px;border:1px solid var(--gray-100);border-radius:10px;background:var(--gray-50);list-style:none;font-size:13px;line-height:20px}
.insurance__benefits li{display:flex;align-items:center;gap:8px}
.detail__table-wrap{border:1px solid var(--gray-200);border-radius:12px;overflow:hidden}
.detail__table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:16px;line-height:24px}
.detail__table th,.detail__table td{padding:8px 24px;text-align:left;font-weight:400}
.detail__table th{padding-top:10px;padding-bottom:10px;background:var(--gray-50);color:var(--text-secondary);border-bottom:1px solid var(--gray-100);font-size:13px;line-height:20px;font-weight:600}
.detail__table tr+tr td{border-top:1px solid var(--gray-200)}
.detail__table th+th,.detail__table td+td{text-align:right}
.detail__table td+td{font-weight:600}
.detail__table .is-free{color:var(--primary)}
.detail__payment{display:block;width:100%;height:54px;padding:0 16px;border:1px solid var(--gray-200);border-radius:14px;appearance:none;font-family:var(--font);font-size:14px;color:var(--text-primary);background:var(--white) url('assets/icons/chevron-down.svg') no-repeat right 16px center;background-size:16px}
.detail__bill-group{margin:0 0 24px}
.detail__bill-group summary{display:flex;align-items:center;gap:8px;list-style:none;font-size:14px;line-height:22px;font-weight:600;color:var(--text-primary)}
.detail__bill-group summary strong{margin-left:auto}
.detail__bill-group:not([open]) summary img{transform:rotate(180deg)}
.detail__bill-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;line-height:22px;color:var(--text-primary)}
.detail__bill-row--small{font-size:13px;line-height:20px;color:var(--text-secondary)}
.detail__bill-group>summary+.detail__bill-row{margin-top:16px}
.detail__discount{color:var(--text-secondary)}
.detail__discount-box{padding:14px;background:var(--gray-50);border-radius:12px;margin-top:16px}
.detail__discount-box .detail__bill-row{margin-top:0;gap:6px}
.detail__discount-label{display:flex;gap:4px;align-items:center;flex:1;min-width:0}
.detail__coupon{color:var(--primary);font-size:12px;line-height:18px;padding:2px 4px;border-radius:4px;background:var(--blue-50);white-space:nowrap}
.detail__remove{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none}
.detail__discount-note{font-size:12px;line-height:18px;color:var(--text-secondary);margin:8px 0 14px;padding-left:12px;position:relative}
.detail__discount-note:before{content:'';position:absolute;left:3px;top:1px;height:16px;width:2px;background:var(--gray-300);border-radius:4px}
.detail__credit{width:68px;min-width:0;padding:0;border:0;font-family:var(--font);font-size:14px;line-height:22px;text-align:right;background:transparent;color:var(--text-secondary);appearance:textfield}
.detail__credit::-webkit-inner-spin-button{appearance:none}
.detail__credit-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;color:var(--text-secondary);font-size:12px;line-height:18px}
.detail__credit-tools button{color:var(--primary)}
.detail__switch{display:flex;align-items:center;gap:8px;font-size:12px;line-height:18px;color:var(--text-tertiary);margin-top:8px;cursor:pointer}
.detail__switch input{appearance:none;width:28px;height:16px;border-radius:16px;background:var(--gray-200);position:relative;margin:0}
.detail__switch input:before{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--white)}
.detail__switch input:checked{background:var(--primary)}
.detail__switch input:checked:before{left:14px}
.detail__total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px;padding-top:20px;border-top:1px solid var(--gray-200);font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.detail__total strong{color:var(--primary);font-size:16px;line-height:24px}
.detail__reward{padding:16px;border-radius:12px;background:var(--gray-50)}
.detail__reward summary{display:flex;align-items:center;gap:4px;font-size:14px;line-height:22px;list-style:none}
.detail__reward summary strong{margin-left:auto}
.detail__reward:not([open]) summary>img:last-child{transform:rotate(180deg)}
.detail__reward .detail__bill-row{margin-top:16px;font-size:14px;line-height:22px}
.detail__reward-tag{position:relative;display:inline-flex;align-items:center;justify-content:center;width:56px;height:20px;font-size:12px;line-height:18px;font-weight:600;color:var(--primary);margin-left:8px}
.detail__reward-tag img{position:absolute;inset:0}
.detail__reward-tag span{position:relative}
.detail__section--cautions{border:0;padding:16px}
.detail__section--cautions .detail__heading{margin-bottom:16px}
.detail__cautions{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13px;line-height:20px;color:var(--text-secondary)}
.detail__cautions li{display:flex;align-items:flex-start;gap:2px}
.detail__cautions img{margin-top:2px}
.detail__agree{padding:16px 16px 0;scroll-margin-top:16px}
.detail__agree-card{border:1px solid var(--gray-200);border-radius:12px;padding:16px}
.detail__agree-head{display:flex;align-items:center;gap:8px}
.detail__agree label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.detail__agree input{appearance:none;flex:none;width:24px;height:24px;margin:0;border:0;border-radius:50%;background:transparent url('assets/icons/circle.svg') center no-repeat}
.detail__agree input:checked{background:var(--blue-50) url('assets/icons/check.svg') center no-repeat}
.detail__agree-toggle{display:flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none}
.detail__agree-body{margin-top:16px;padding:20px 0 8px;border-top:1px solid var(--gray-100);font-size:14px;line-height:22px;color:var(--text-secondary)}
.detail__agree-body[hidden]{display:none}
.detail__agree-note{margin-top:10px;font-size:13px;line-height:20px;color:var(--text-secondary)}
.detail__summary{position:sticky;top:0;padding:30px 16px;min-width:0}
.detail__summary h2{font-size:20px;line-height:28px;color:var(--text-strong);font-weight:700;margin-bottom:20px}
.detail__summary dl{margin:0 0 20px;display:grid;gap:10px;font-size:13px;line-height:20px}
.detail__summary dl>div{display:flex;align-items:flex-start;gap:18px}
.detail__summary dt{flex:none;width:53px;color:var(--text-secondary);background:var(--gray-50);font-size:12px;line-height:18px;text-align:center;padding:1px 0;border-radius:4px}
.detail__summary dd{margin:0;flex:1;min-width:0;color:var(--text-primary);font-weight:400}
.detail__summary-bill{padding:20px 16px;border-radius:14px;background:var(--gray-50)}
.detail__summary-bill .detail__total{border:0;padding:0;margin:0 0 20px;font-size:16px}
.detail__summary-bill .detail__bill-row{margin-top:4px;font-size:14px;line-height:22px}
.detail__checklist{display:grid;gap:6px;margin:32px 0 16px}
.detail__checklist button{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#637080;border-radius:6px;font-weight:600}
.detail__task-label{display:inline-flex;align-items:center;gap:1px}
.detail__task-label>span:first-child{flex:none}
.detail__checklist .detail__task-label{flex:1;min-width:0}
.detail__task-state{display:inline-flex;align-items:center;gap:6px;flex:none}
.detail__task-badge{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;border:1px solid var(--orange-100);border-radius:999px;background:var(--orange-50);color:var(--orange-600);font-size:10px;line-height:16px;white-space:nowrap}
.detail__task-badge>span{flex:none}
.detail__checklist .is-done .detail__task-badge{border-color:var(--blue-100);background:var(--blue-50);color:var(--primary)}
.detail__required{color:var(--negative)}
.detail__pay{display:block;width:100%;padding:16px;border-radius:12px;text-align:center;font-size:16px;line-height:24px;font-weight:600;background:var(--primary);color:var(--white)}
.detail__pay:hover{background:var(--primary-strong)}
.detail__pay:disabled{cursor:default;background:var(--gray-100);color:var(--text-disabled)}
.detail__pay-hint{display:none}
.detail__mobile-pay{display:none}
.detail__footer{max-width:1280px;margin:0 auto;padding:16px 16px 32px}
.detail__footer-top{display:flex;align-items:center;justify-content:space-between;height:42px;margin-bottom:32px}
.detail__footer-columns{display:flex;gap:42px}
.detail__footer-company{flex:1;min-width:0;color:var(--text-secondary);font-size:13px;line-height:20px;font-weight:600}
.detail__footer-policies{font-size:18px;line-height:26px;color:var(--text-primary);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.detail__footer-company small{display:block;margin-top:16px;font-size:16px;line-height:24px}
.detail__footer-links{display:flex;gap:0}
.detail__footer-links div{width:128px}
.detail__footer-links strong{display:block;font-size:16px;line-height:24px;margin-bottom:12px}
.detail__footer-links p{font-size:14px;line-height:22px;color:var(--text-secondary);margin-bottom:6px}
.detail-dialog{position:absolute;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(20,26,36,.4)}
.detail-dialog__panel{width:min(440px,100%);padding:24px;border-radius:20px;background:var(--white);box-shadow:0 16px 48px rgba(20,26,36,.16)}
.detail-dialog h2{font-size:20px;line-height:28px;color:var(--text-strong);margin-bottom:16px}
.detail-dialog p{font-size:14px;line-height:22px;margin-bottom:12px}
.detail-dialog .btn{display:block;width:100%;text-align:center;margin-top:20px}
.app.is-detail{position:relative}
@media (max-width:1340px){.detail__wrap{padding-left:32px;padding-right:32px}.detail__grid{gap:48px;grid-template-columns:minmax(0,720px) minmax(280px,380px)}.detail__back{left:48px}.detail__footer-links div{width:110px}}
.app.is-mobile.is-detail .gnb{display:none}
.app.is-mobile .detail__mobile-header{display:flex;align-items:center;justify-content:space-between;height:68px;padding:16px 10px 0;background:var(--white)}
.detail__mobile-header button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.app.is-mobile .detail__wrap{padding:0 0 180px}
.app.is-mobile .detail__back{display:none}
.app.is-mobile .detail__grid{display:block}
.app.is-mobile .detail__summary,.app.is-mobile .detail__footer{display:none}
.app.is-mobile .detail__hero{padding:0 16px 20px}
.app.is-mobile .detail__photo{margin-bottom:24px}
.app.is-mobile .detail__date{display:block;text-align:center;margin-top:16px;padding:16px;border-radius:14px;background:var(--gray-50);font-size:14px;line-height:22px;font-weight:600;color:var(--text-secondary)}
.app.is-mobile .detail__options{border-top:12px solid var(--gray-100);padding:24px 16px;gap:12px}
.app.is-mobile .detail__options>h2{display:block;margin:0 0 4px;font-size:16px;line-height:24px;font-weight:600}
.app.is-mobile .detail__tags{padding-right:40px}
.app.is-mobile .detail__request textarea,.app.is-mobile .detail__payment,.app.is-mobile .detail__credit{font-size:16px}
.app.is-mobile .detail__mobile-pay{display:block;position:absolute;bottom:0;left:0;right:0;z-index:35;padding:0;background:transparent}
.detail__mobile-cta{padding:6px 16px max(34px,env(safe-area-inset-bottom,0px));background:var(--white)}
.detail__mobile-tasks{display:flex;align-items:center;justify-content:center;gap:28px;height:42px;padding:12px 16px 10px;background:url('assets/icons/detail-tasks-gradient.png') center/100% 42px no-repeat}
.detail__mobile-tasks button{display:flex;align-items:center;justify-content:center;gap:6px;position:relative;flex:none;min-width:0;border:0;border-radius:0;height:20px;font-size:13px;line-height:20px;font-weight:600;color:#637080;white-space:nowrap}
.detail__mobile-tasks[hidden],.detail__mobile-tasks button[hidden]{display:none!important}
.detail__mobile-tasks button:before{content:'';position:absolute;inset:-12px -4px}


.detail__mobile-pay[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.detail{scroll-behavior:auto}}


/* Figma 2026-10-08: shared search card, return option, underline tabs, zone fare. */
.controls{padding:2px 16px 0}
.seg__new{padding:4px 5px;height:16px;border:1px solid var(--orange-200)}
.seg__new img{display:block}
.fields,.app.is-mobile .fields{gap:0;margin-top:18px;border:1px solid var(--border);border-radius:12px;background:var(--gray-50);overflow:hidden}
.field,.field:hover{border:0;border-radius:0;background:transparent;padding:12px;min-height:46px}
.loc-fields{position:relative;padding:13px 12px 12px;display:flex;flex-direction:column;gap:8px}
.loc-fields::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--border)}
.locrow,.locrow:hover{padding:0;gap:6px;border:0;border-radius:0;background:transparent;min-height:24px}
.locrow+.locrow{border:0}
.loc__trail{display:flex;margin-left:6px}
.locrow__title.is-placeholder{color:#99A1B1}
.ret-slot{position:relative;align-items:center;gap:2px;margin-top:10px;min-height:22px}
.ret-toggle{gap:12px;border-radius:4px}
.ret-toggle__label{color:#354153}
.ret-toggle__fee{margin-left:-10px;font-size:14px;line-height:22px;font-weight:600;color:#4B68FF}
.ret-help-area{display:flex;align-items:center}

.ret-help-tip{position:absolute;left:0;top:30px;z-index:30;display:flex;gap:12px;width:min(278px,100%);padding:16px;border-radius:12px;background:#596373;color:white;box-shadow:0 4px 12px #26303c20;font-size:14px;line-height:22px}
.ret-help-tip::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.ret-help-tip p{flex:1;min-width:0}
.ret-help-tip button{flex:none;display:flex;align-self:flex-start;margin-top:2px}
.chips,.app.is-mobile .chips{gap:16px;margin-top:32px;padding:6px 16px 0;height:39px;min-height:39px;border-bottom:1px solid var(--border);overflow-x:auto}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 0 8px;border:0;border-radius:0;font-size:16px;line-height:24px;color:var(--text-secondary);background:white}

.chip[aria-pressed="true"]{background:white;color:var(--text-primary);border:0}

.chip:focus-visible{outline-offset:-3px}

.zoneinfo__addr{font-size:13px;line-height:20px;font-weight:400;color:#697383}
.zoneinfo__oneway{font-size:13px;line-height:20px;font-weight:400;color:#4B68FF;white-space:nowrap}
.zone-query-status{min-height:0;padding:16px;background:var(--gray-50);border-bottom:0;color:#697383;font-size:13px;line-height:20px}

.zone-query-status .text-btn{display:block;margin-top:8px;color:var(--primary)}
.return-pending{padding:40px 16px;color:var(--gray-400);font-size:16px;line-height:24px;font-weight:600;text-align:center}
.list-empty{padding:40px 16px;color:var(--text-tertiary);font-size:16px;line-height:24px;font-weight:600;text-align:center}
.cars,.dlist{gap:4px}
.car,.car__dim{gap:18px}
.sheet{position:relative}
.sheet--dropdown{position:fixed}
.sheet--modal{width:min(482px,100%);height:min(700px,calc(100vh - 48px))}
.sheet__body--map{padding-bottom:76px}

.search-jeju img{flex:none}

.detail__places-heading{margin-top:24px}
.detail__rental-method:has(.detail__places-heading) .detail__place-note{color:#99A1B1;background:#EBF5FF}

/* ── 편도 지도 정책: 지도 이동 버튼 (Figma 14066:121457 · 디바이스=PC/MO) ── */
.mapmove{position:absolute;left:50%;top:20px;z-index:8;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:50px;background:rgba(38,47,60,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 6px rgba(0,0,0,.15),0 4px 6px rgba(0,0,0,.04);color:#fff;font-size:14px;font-weight:600;line-height:22px;white-space:nowrap;animation:mapmove-in .24s cubic-bezier(.2,.7,.2,1)}
.mapmove[hidden]{display:none}
.mapmove:hover{background:rgba(20,26,36,.92)}
.mapmove:focus-visible{outline-color:#fff;outline-offset:2px}
.mapmove__icon{flex:none;display:flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;background:#637080}
.mapmove__icon svg{display:block;width:14px;height:14px;transform:rotate(var(--deg,0deg));transition:transform .18s ease-out}
@keyframes mapmove-in{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
/* PC: 버튼 뒤 상단 딤 (Figma dimmed · 120px · black 10%→0) */
.map__dim{position:absolute;left:0;right:0;top:0;height:120px;z-index:7;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,0));pointer-events:none;opacity:0;transition:opacity .2s}
.app:not(.is-mobile) .map.has-mapmove .map__dim{opacity:1}
/* PC: 버튼이 상단 가운데를 쓰는 동안 스낵바·재검색 필은 그 아래로 */
.app:not(.is-mobile) .map.has-mapmove .map__top{top:76px}
.app:not(.is-mobile) .map.has-mapmove .map__research{top:76px}
/* MO: 시트 위 16px, 36px 사양 */
.app.is-mobile .mapmove{top:auto;bottom:calc(var(--sheet-vis,var(--pad-b,0px)) + 16px);padding:6px 12px 6px 8px;font-size:13px;line-height:20px;max-width:calc(100% - 100px)}
.app.is-mobile .mapmove__icon{width:24px;height:24px}
.app.is-mobile .map.has-mapmove .map__notes{opacity:0}
.ml--far{font-size:calc(16px / var(--z,1));font-weight:700;fill:#8B93A1;letter-spacing:calc(2px / var(--z,1))}
/* 프로토 옵션 2단 — 지도를 가리지 않게 아래 공간을 비워둬요 */
:root{--proto-h:104px}
.stage{height:calc(100% - var(--proto-h))}
.stage.is-frame{--proto-h:0px}
body.is-narrow{--proto-h:0px}
.stage.is-frame ~ .proto-opt{left:16px;flex-direction:column;align-items:stretch;width:208px;padding:10px;row-gap:6px;border-radius:16px}
.stage.is-frame ~ .proto-opt .proto-opt__sep{width:auto;height:1px;margin:2px 0}
.stage.is-frame ~ .proto-opt .proto-opt__label{margin:0}
.stage.is-frame ~ .proto-opt button{text-align:left}
.stage.is-frame ~ .proto-opt--policy{bottom:auto;top:84px}
.stage.is-frame ~ .proto-opt--policy .proto-opt__status{white-space:normal;line-height:16px}
.proto-opt--policy{bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);border-radius:999px}
.proto-opt__status{margin-left:2px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;font-weight:600;line-height:18px;color:#fff;white-space:nowrap}
.proto-opt__status[data-branch="fit"]{background:rgba(0,187,131,.4)}
.proto-opt__status[data-branch="split"]{background:rgba(255,136,0,.45)}
.proto-opt--policy button[data-policy-example]{color:#fff;background:rgba(255,255,255,.12)}
.proto-opt--policy button[data-policy-example]:hover{background:rgba(255,255,255,.22)}
body.is-narrow .proto-opt--policy{top:calc(52px + env(safe-area-inset-top,0px));bottom:auto;left:8px;right:8px;max-width:none;padding:3px 8px;border-radius:14px;overflow-x:auto;scrollbar-width:none}
body.is-narrow .proto-opt.proto-opt--policy>*{display:inline-flex}
body.is-narrow .proto-opt.proto-opt--policy .proto-opt__label,body.is-narrow .proto-opt.proto-opt--policy .proto-opt__sep{display:none}

function updateRequestChip() {
  const chip = document.querySelector('.detail__request-chip');
  if (!chip) return;
  const input = document.getElementById('deliveryRequest');
  const mobile = isMobile();
  const header = document.querySelector(mobile ? '.detail__mobile-header' : '.gnb');
  const appBounds = document.getElementById('app').getBoundingClientRect();
  const headerBounds = header && header.getBoundingClientRect();
  if (headerBounds) chip.style.top = (headerBounds.bottom - appBounds.top + 12) + 'px';
  if (mobile) chip.style.removeProperty('left');
  else {
    const column = document.querySelector('.detail__left').getBoundingClientRect();
    chip.style.left = (column.left + column.width / 2 - appBounds.left) + 'px';
  }
  const ready = detailState && detailState.account === 'ready';
  const passed = input && headerBounds && document.querySelector('.detail__request').getBoundingClientRect().bottom < headerBounds.bottom;
  // Focus can remain on the empty input after scrolling away; it must not dismiss the reminder.
  chip.hidden = !(ready && detailState.mode === 'delivery' && !detailState.requestSaved && !detailState.request.trim() && passed && !requestJumping && !detailDialog);
}

function jumpToDeliveryRequest() {
  const input = document.getElementById('deliveryRequest');
  if (!input) { focusDeliveryRequest(); return; }
  requestJumping = true;
  updateRequestChip();
  const scroller = document.getElementById('carDetail');
  const header = document.querySelector('.detail__mobile-header');
  const section = document.getElementById('detailPlaces');
  const offset = isMobile() ? header.offsetHeight + 16 : 16;
  const top = Math.max(0, scroller.scrollTop + section.getBoundingClientRect().top - scroller.getBoundingClientRect().top - offset);
  scroller.scrollTo({top,behavior:reduce()?'auto':'smooth'});
  const complete = () => {
    requestJumping = false;
    if (input.isConnected && !input.readOnly) {
      input.focus({preventScroll:true});
      input.closest('.detail__request').classList.add('is-guided');
      setTimeout(()=>input.closest('.detail__request')?.classList.remove('is-guided'),1200);
    }
    updateRequestChip();
  };
  // Focus after the smooth scroll, so the keyboard does not interrupt it.
  setTimeout(complete,reduce()?0:450);
}

  if (canMapEdit() && S.moving) { [S.cx, S.cy] = clampCenter(S.cx, S.cy, S.z); followCenter(); }

  const chips = $('#chips'), band = $('#feeBand'), firstCar = $('.car[data-car]');

  const required = base + chips.offsetHeight + marginTop(chips) + (band.hidden ? 0 : band.offsetHeight + marginTop(band)) + marginTop($('#list')) + (S.mode === 'zone' ? ($('.zoneinfo')?.offsetHeight || (zoneOneWayOn() ? 72 : 0)) + ($('.zone-query-status')?.offsetHeight || 0) : 0) + (firstCar ? firstCar.offsetHeight : 110) + 16;
  const half = Math.min(full, Math.max(peek + 80, Math.round(mainH * 0.55)));   // 기본: 55%

  $('#map').style.setProperty('--sheet-vis', sheetVis + 'px');   // 지도 이동 버튼은 시트 바로 위를 따라감
  syncMapMove();

  panelEl.style.setProperty('--sheet-top-space', (SHEET_FULL_TOP + (SHEET_HALF_TOP - SHEET_FULL_TOP) * progress) + 'px');

}

  setSheet('half', { updateMap: !preserveMap });

  $('#resultsScroll').scrollTop = Math.max(0,h.required-h.half);
}
function setSheet(snap, { updateMap = false } = {}) {
  if (!isMobile()) return;

  if (updateMap) {

  $$('.proto-opt [data-pc-only]').forEach(el => { el.hidden = mobile; });
  if (detailState) { const scroll=$('#carDetail').scrollTop; renderCarDetail(); $('#carDetail').scrollTop=scroll; return; }
  requestAnimationFrame(() => {
    if (detailState) return;
    measure();
    if (mobile) { if (showBar()) setSheet('hidden', { updateMap: true }); else if ((S.mode === 'delivery' || zoneOneWayOn()) && !compact) revealCars(); else setSheet('half', { updateMap: true }); }

    if (e.key === 'ArrowDown') { e.preventDefault(); setSheet(sheetSnap === 'full' ? 'half' : 'peek'); }
  });
  $('#sheetMapReturn').addEventListener('click', () => {
    stopMomentum(); clearTimeout(wheelTimer); wheel = null; drag = null; panelEl.classList.remove('is-dragging');
    revealCars({ preserveMap:true }); handle.focus({ preventScroll:true });
  });
  $$('.proto-opt [data-view]').forEach(btn => btn.addEventListener('click', () => {
    S.view = btn.dataset.view;
    $$('.proto-opt [data-view]').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
    applyLayout();
  }));
  MQ.addEventListener('change', applyLayout);
  $('#protoReset').addEventListener('click', resetAll);
  $$('.proto-opt [data-pins]').forEach(btn => btn.addEventListener('click', () => {
    appEl.classList.toggle('pins-split', btn.dataset.pins === 'split');
    $$('.proto-opt [data-pins]').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
  }));
}

/* ── 프로토타입: 입력값 초기화 ── */
function resetAll() {
  if (detailState) closeCarDetail(false);
  ++zoneQueryGeneration; zoneSearchCamera = null; policyFit = null; policyPending = false;
  closeAll(); stopAnim(); clearTimeout(plantT);
  const keep = { view: S.view, searchUI: S.searchUI, padB: S.padB, cx: S.cx, cy: S.cy, z: S.z };   // 보기·검색 방식은 유지, 지도는 지금 자리에서 출발
  const fresh = JSON.parse(JSON.stringify(S_INIT));
  Object.keys(S).forEach(k => { if (!(k in fresh)) delete S[k]; });
  Object.assign(S, fresh, keep);
  [appEl, $('.main'), $('.main__inner')].forEach(el => { el.scrollTop = 0; el.scrollLeft = 0; });
  $('#map').dataset.mode = '';                 // 쏘카존 핀이 다시 떨어지는 애니메이션
  render({ animate: true, resetScroll: true });
  if (isMobile()) { sheetSnap = 'half'; setSheet('half', { updateMap: true }); }
  flyTo(S_INIT.cx, S_INIT.cy, S_INIT.z);
  topSnack('입력값을 처음 상태로 돌렸어요.');
}

/* ── init ── */
function init() {
  $('#dateIcon').innerHTML = I.cal;
  $('#protoResetIcon').outerHTML = I.refresh;
  $('#zoomIn').innerHTML = I.plus;
  $('#zoomOut').innerHTML = I.minus;
  $('#chips').innerHTML = CHIPS.map(c => `<button type="button" class="chip" data-chip="${c}" aria-pressed="false">${c}</button>`).join('');
  measure(); drawMap(); applyView(); render(); bind(); bindPolicy(); bindSheet(); bindCarDetail(); applyLayout();
  restoreCarDetailRoute();
  initBarMotionReview();
}
init();
})();

</script>
</body>
